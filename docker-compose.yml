version: '3.8'

volumes:
  pyasco_venv:

services:
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - ~/.pyasco:/root/.pyasco
      - pyasco_venv:/opt/venv
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - PYASCO_AUTO=${PYASCO_AUTO:-false}
    restart: unless-stopped
    command: python -m pyasco.app.telegram_bot --telegram-token ${TELEGRAM_BOT_TOKEN} --model ${LLM_MODEL}
